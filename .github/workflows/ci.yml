name: Full CI Pipeline

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

env:
  NODE_VERSION: '20.x'

jobs:
  # Quick validation job that runs first
  validate:
    name: Validate Changes
    runs-on: ubuntu-latest
    outputs:
      backend-changed: ${{ steps.filter.outputs.backend }}
      frontend-changed: ${{ steps.filter.outputs.frontend }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - name: Determine changed paths
        id: filter
        uses: dorny/paths-filter@v3
        with:
          filters: |
            backend:
              - 'backend/**'
            frontend:
              - 'frontend/**'
            docs:
              - 'README.md'
              - '*.md'
            config:
              - '.github/**'
              - 'package.json'
              - 'package-lock.json'

  # Backend jobs (only if backend changed)
  backend-lint:
    name: Backend Lint & Test
    runs-on: ubuntu-latest
    needs: validate
    if: needs.validate.outputs.backend-changed == 'true'
    defaults:
      run:
        working-directory: ./backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
          cache-dependency-path: backend/package-lock.json
      - run: npm ci
      - run: npm run lint 2>/dev/null || echo "No lint script"
      - run: npm run init-db
      - run: npm test 2>/dev/null || echo "No test script"
        env:
          JWT_SECRET: test-secret
          NODE_ENV: test
      - run: node -c server.js && find routes -name "*.js" -exec node -c {} \;

  backend-security:
    name: Backend Security Audit
    runs-on: ubuntu-latest
    needs: validate
    if: needs.validate.outputs.backend-changed == 'true'
    defaults:
      run:
        working-directory: ./backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
          cache-dependency-path: backend/package-lock.json
      - run: npm ci
      - run: npm audit --audit-level=high
        continue-on-error: true

  # Frontend jobs (only if frontend changed)
  frontend-lint:
    name: Frontend Lint & Test
    runs-on: ubuntu-latest
    needs: validate
    if: needs.validate.outputs.frontend-changed == 'true'
    defaults:
      run:
        working-directory: ./frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run lint 2>/dev/null || npx eslint src --ext .js,.jsx --max-warnings=0
      - run: npm test -- --watchAll=false --coverage --passWithNoTests
        env:
          CI: true
      - uses: codecov/codecov-action@v4
        if: always()
        with:
          directory: ./frontend/coverage
          flags: frontend

  frontend-build:
    name: Frontend Build
    runs-on: ubuntu-latest
    needs: [validate, frontend-lint]
    if: needs.validate.outputs.frontend-changed == 'true'
    defaults:
      run:
        working-directory: ./frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run build
        env:
          CI: true
          GENERATE_SOURCEMAP: false
      - uses: actions/upload-artifact@v4
        with:
          name: frontend-build
          path: frontend/build
          retention-days: 7

  # Integration test (runs if both changed or on main branch)
  integration-test:
    name: Integration Test
    runs-on: ubuntu-latest
    needs: [backend-lint, frontend-build]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Start Backend
        run: |
          cd backend
          npm ci
          npm run init-db
          npm start &
          sleep 10
        env:
          JWT_SECRET: integration-test-secret
          NODE_ENV: test
          PORT: 3001

      - name: Verify Backend Health
        run: curl -f http://localhost:3001/api/health

      - name: Install Frontend & Run E2E
        run: |
          cd frontend
          npm ci
          # Add Cypress/Playwright here when available
          echo "E2E tests would run here"

  # Deployment jobs (only on main branch push)
  deploy-backend:
    name: Deploy Backend
    runs-on: ubuntu-latest
    needs: [backend-lint, backend-security, integration-test]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    environment: production
    steps:
      - uses: actions/checkout@v4

      - name: Deploy to Railway
        uses: railwayapp/railway-deploy@v1
        if: ${{ secrets.RAILWAY_TOKEN != '' }}
        with:
          token: ${{ secrets.RAILWAY_TOKEN }}
          service: bus-booking-backend
        continue-on-error: true

      - name: Deploy to Render
        uses: render/deploy-action@v1
        if: ${{ secrets.RENDER_API_KEY != '' }}
        with:
          api-key: ${{ secrets.RENDER_API_KEY }}
          service-id: ${{ secrets.RENDER_SERVICE_ID }}
        continue-on-error: true

      - name: Deploy to Fly.io
        uses: superfly/flyctl-actions@setup-flyctl
        if: ${{ secrets.FLY_API_TOKEN != '' }}
        with:
          version: 'latest'
        continue-on-error: true

      - name: Deploy to Fly.io App
        if: ${{ secrets.FLY_API_TOKEN != '' }}
        run: flyctl deploy --app bus-booking-backend --remote-only
        continue-on-error: true

  deploy-frontend:
    name: Deploy Frontend
    runs-on: ubuntu-latest
    needs: [frontend-lint, frontend-build, integration-test]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    environment: production
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: frontend-build
          path: ./build

      - name: Deploy to Netlify
        uses: nwtgck/actions-netlify@v3.0
        if: ${{ secrets.NETLIFY_AUTH_TOKEN != '' }}
        with:
          publish-dir: ./build
          production-branch: main
          github-token: ${{ secrets.GITHUB_TOKEN }}
          deploy-message: "Production deploy from ${{ github.sha }}"
        env:
          NETLIFY_AUTH_TOKEN: ${{ secrets.NETLIFY_AUTH_TOKEN }}
          NETLIFY_SITE_ID: ${{ secrets.NETLIFY_SITE_ID }}

      - name: Deploy to Vercel
        uses: amondnet/vercel-action@v25
        if: ${{ secrets.VERCEL_TOKEN != '' }}
        with:
          vercel-token: ${{ secrets.VERCEL_TOKEN }}
          vercel-org-id: ${{ secrets.VERCEL_ORG_ID }}
          vercel-project-id: ${{ secrets.VERCEL_PROJECT_ID }}
          vercel-args: '--prod'
        continue-on-error: true

      - name: Deploy to GitHub Pages
        uses: peaceiris/actions-gh-pages@v3
        if: ${{ secrets.GITHUB_TOKEN != '' }}
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./build
          force_orphan: true
          user_name: 'github-actions[bot]'
          user_email: 'github-actions[bot]@users.noreply.github.com'

  # Notify on completion
  notify:
    name: Notify
    runs-on: ubuntu-latest
    needs: [deploy-backend, deploy-frontend]
    if: always()
    steps:
      - name: Send Slack notification
        uses: 8398a7/action-slack@v3
        if: ${{ secrets.SLACK_WEBHOOK_URL != '' }}
        with:
          status: ${{ job.status }}
          channel: '#deployments'
          text: 'BusBooking deployment completed'
          fields: repo,message,commit,author,action,eventName,ref,workflow
        env:
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}

      - name: Send Discord notification
        uses: Ilshidur/action-discord@master
        if: ${{ secrets.DISCORD_WEBHOOK != '' }}
        with:
          webhook: ${{ secrets.DISCORD_WEBHOOK }}
          title: 'BusBooking Deployment'
          description: 'Deployment ${{ job.status }}'
          color: ${{ job.status == 'success' && '3066993' || '15158332' }}