  deploy-backend:
    name: Deploy Backend
    runs-on: ubuntu-latest
    needs: [backend-lint, backend-security, integration-test]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    environment: production
    env:
      RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN }}
      RENDER_API_KEY: ${{ secrets.RENDER_API_KEY }}
      RENDER_SERVICE_ID: ${{ secrets.RENDER_SERVICE_ID }}
      FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
    steps:
      - uses: actions/checkout@v4

      - name: Deploy to Railway
        uses: railwayapp/railway-deploy@v1
        if: env.RAILWAY_TOKEN != ''
        with:
          token: ${{ env.RAILWAY_TOKEN }}
          service: bus-booking-backend
        continue-on-error: true

      - name: Deploy to Render
        uses: render/deploy-action@v1
        if: env.RENDER_API_KEY != ''
        with:
          api-key: ${{ env.RENDER_API_KEY }}
          service-id: ${{ env.RENDER_SERVICE_ID }}
        continue-on-error: true

      - name: Deploy to Fly.io
        uses: superfly/flyctl-actions@setup-flyctl
        if: env.FLY_API_TOKEN != ''
        with:
          version: 'latest'
        continue-on-error: true

      - name: Deploy to Fly.io App
        if: env.FLY_API_TOKEN != ''
        run: flyctl deploy --app bus-booking-backend --remote-only
        continue-on-error: true

  deploy-frontend:
    name: Deploy Frontend
    runs-on: ubuntu-latest
    needs: [frontend-lint, frontend-build, integration-test]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    environment: production
    env:
      NETLIFY_AUTH_TOKEN: ${{ secrets.NETLIFY_AUTH_TOKEN }}
      NETLIFY_SITE_ID: ${{ secrets.NETLIFY_SITE_ID }}
      VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
      VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
      VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: frontend-build
          path: ./build

      - name: Deploy to Netlify
        uses: nwtgck/actions-netlify@v3.0
        if: env.NETLIFY_AUTH_TOKEN != ''
        with:
          publish-dir: ./build
          production-branch: main
          github-token: ${{ secrets.GITHUB_TOKEN }}
          deploy-message: "Production deploy from ${{ github.sha }}"
        env:
          NETLIFY_AUTH_TOKEN: ${{ env.NETLIFY_AUTH_TOKEN }}
          NETLIFY_SITE_ID: ${{ env.NETLIFY_SITE_ID }}

      - name: Deploy to Vercel
        uses: amondnet/vercel-action@v25
        if: env.VERCEL_TOKEN != ''
        with:
          vercel-token: ${{ env.VERCEL_TOKEN }}
          vercel-org-id: ${{ env.VERCEL_ORG_ID }}
          vercel-project-id: ${{ env.VERCEL_PROJECT_ID }}
          vercel-args: '--prod'
        continue-on-error: true

      - name: Deploy to GitHub Pages
        uses: peaceiris/actions-gh-pages@v3
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./build
          force_orphan: true
          user_name: 'github-actions[bot]'
          user_email: 'github-actions[bot]@users.noreply.github.com'

  notify:
    name: Notify
    runs-on: ubuntu-latest
    needs: [deploy-backend, deploy-frontend]
    if: always()
    env:
      SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
      DISCORD_WEBHOOK: ${{ secrets.DISCORD_WEBHOOK }}
    steps:
      - name: Send Slack notification
        uses: 8398a7/action-slack@v3
        if: env.SLACK_WEBHOOK_URL != ''
        with:
          status: ${{ job.status }}
          channel: '#deployments'
          text: 'BusBooking deployment completed'
          fields: repo,message,commit,author,action,eventName,ref,workflow
        env:
          SLACK_WEBHOOK_URL: ${{ env.SLACK_WEBHOOK_URL }}

      - name: Send Discord notification
        uses: Ilshidur/action-discord@master
        if: env.DISCORD_WEBHOOK != ''
        with:
          webhook: ${{ env.DISCORD_WEBHOOK }}
          title: 'BusBooking Deployment'
          description: 'Deployment ${{ job.status }}'
          color: ${{ job.status == 'success' && '3066993' || '15158332' }}
